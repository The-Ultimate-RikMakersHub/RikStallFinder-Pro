<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RikMakersHub | Local Food Registry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>RikStallFinder-Pro <span class="badge-pro">PRO</span></h1>
    </header>

    <main id="app-screen" class="container grid-layout">
        <!-- Left: Vendor Info -->
        <div class="left-column">
            <section class="card profile-card">
                <h2 id="vendor-name">Loading...</h2>
                <div id="menu-container" class="menu-grid"></div>
            </section>
        </div>
        <!-- Right: Dynamic QR -->
        <div class="right-column">
            <section class="card qr-card">
                <h3>Scan to Order</h3>
                <img id="dynamic-qr" src="" alt="QR Code" class="qr-img">
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
